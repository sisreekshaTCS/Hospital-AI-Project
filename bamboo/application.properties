spring.application.name=ai
server.port=8080

spring.datasource.url=$bamboo_hosptal_db_url
spring.datasource.username=$bamboo_hosptal_db_username
spring.datasource.password=$bamboo_hosptal_db_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true

gemini.api.key=$bamboo_gemini_api_key